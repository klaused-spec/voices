<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Prefetch Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module" id="pdfjs-script"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a12;--surface:#13131f;--surface2:#1c1c2e;--border:#2a2a42;
  --accent:#7c3aed;--accent2:#6d28d9;--green:#22c55e;--yellow:#eab308;
  --red:#ef4444;--text:#e2e8f0;--muted:#64748b;--radius:12px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.subtitle{color:var(--muted);font-size:.85rem;margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1200px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
label{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
textarea{width:100%;height:320px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;padding:12px;resize:vertical;outline:none;transition:border .2s}
textarea:focus{border-color:var(--accent)}
select,input[type=text]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;padding:10px 12px;outline:none;transition:border .2s}
select:focus,input:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;margin-top:12px}
.row>*{flex:1}
btn,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:8px;border:none;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
/* Progress */
.progress-wrap{margin-top:16px}
.progress-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.progress-bar{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:999px;transition:width .4s}
/* Paragraphs list */
.para-list{display:flex;flex-direction:column;gap:8px;max-height:480px;overflow-y:auto;padding-right:4px}
.para-list::-webkit-scrollbar{width:4px}
.para-list::-webkit-scrollbar-track{background:transparent}
.para-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
.para-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .2s;position:relative;user-select:none}
.para-item:hover{border-color:var(--accent)}
.para-item.selected{border-color:#7c3aed;background:#170f2a;box-shadow:0 0 0 1px #7c3aed44}
.para-item.playing{border-color:var(--accent);background:#1e1530}
.para-item.cached{border-color:#1a3a2a}
.para-item.cached.selected{border-color:#7c3aed;background:#170f2a}
.para-item.error{border-color:#3a1a1a}
.para-meta{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.para-idx{font-size:.7rem;color:var(--muted);font-weight:600}
.para-badge{font-size:.65rem;padding:2px 8px;border-radius:999px;font-weight:600;margin-left:auto}
.badge-queued{background:#1c1c2e;color:var(--muted)}
.badge-loading{background:#1e1a00;color:var(--yellow)}
.badge-cached{background:#0f2a1a;color:var(--green)}
.badge-playing{background:#1e1030;color:#a78bfa}
.badge-error{background:#2a0f0f;color:var(--red)}
.para-text{font-size:.78rem;color:#94a3b8;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sel-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.78rem;color:var(--muted)}
.sel-toolbar button{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.72rem;padding:3px 8px;cursor:pointer}
.sel-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.sel-count{color:var(--accent);font-weight:600}
/* Player */
.player{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px}
.player-title{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.player-text{font-size:.85rem;color:var(--text);line-height:1.5;min-height:40px;margin-bottom:12px;font-style:italic}
.player-controls{display:flex;align-items:center;gap:10px}
.ctrl-btn{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .2s}
.ctrl-prev,.ctrl-next{background:var(--surface);color:var(--text)}
.ctrl-prev:hover,.ctrl-next:hover{background:var(--border)}
.ctrl-play{background:var(--accent);color:#fff;width:42px;height:42px}
.ctrl-play:hover{background:var(--accent2);transform:scale(1.05)}
.audio-progress{flex:1;height:4px;background:var(--border);border-radius:999px;cursor:pointer;position:relative}
.audio-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .1s}
.token-row{margin-top:12px}
.pdf-drop{border:1.5px dashed var(--border);border-radius:8px;padding:10px 14px;margin-top:10px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border .2s;font-size:.85rem;color:var(--muted)}
.pdf-drop:hover{border-color:var(--accent);color:var(--accent)}
.pdf-drop input{display:none}
.pdf-status{font-size:.78rem;color:var(--green);margin-top:6px;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
@media(max-width:768px){.grid{grid-template-columns:1fr}.para-list{max-height:260px}}
</style>
</head>
<body>
<div style="max-width:1200px;margin:0 auto">
  <h1>🎙️ TTS Prefetch Studio</h1>
  <p class="subtitle">Cole o texto, selecione a voz e faça o prefetch de todos os parágrafos antes de ouvir.</p>

  <div class="grid">
    <!-- LEFT -->
    <div>
      <div class="card">
        <label>Texto</label>
        <textarea id="inputText" placeholder="Cole aqui o texto que deseja ouvir...&#10;&#10;Dica: selecione um trecho antes de clicar 'Ver parágrafos' para ver só aquela parte."></textarea>
        <label class="pdf-drop" id="pdfDropLabel" title="Importar PDF">
          <input type="file" id="pdfInput" accept=".pdf" onchange="loadPdf(this)">
          <span>📄</span> <span id="pdfLabel">Importar PDF…</span>
        </label>
        <div class="pdf-status" id="pdfStatus"></div>

        <div class="row">
          <div>
            <label style="margin-top:12px">Voz</label>
            <select id="voiceSelect"><option value="">Carregando vozes...</option></select>
          </div>
          <div>
            <label style="margin-top:12px">Modelo</label>
            <select id="modelSelect">
              <option value="gemini-2.5-flash-preview-tts">Flash TTS (padrão)</option>
              <option value="gemini-2.5-pro-preview-tts">Pro TTS (HD)</option>
            </select>
          </div>
          <div>
            <label style="margin-top:12px">Simultâneos</label>
            <select id="concurrency">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>
          <div>
            <label style="margin-top:12px">Dividir por</label>
            <select id="splitMode">
              <option value="para">Parágrafo (\n\n)</option>
              <option value="line">Linha (\n)</option>
              <option value="sent" selected>Frases (.!?)</option>
            </select>
          </div>
          <div id="sentCountWrap">
            <label style="margin-top:12px" title="Use 1 para compatibilidade com Readera — o cache precisa bater exatamente">Frases/bloco</label>
            <select id="sentCount">
              <option value="1" selected>1 ✓ Readera</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
        </div>

        <div class="token-row">
          <label style="margin-top:12px">Token (se configurado)</label>
          <input type="text" id="tokenInput" placeholder="AUTH_TOKEN (deixe vazio se não usar)" />
        </div>

        <div class="actions">
          <button class="btn btn-secondary" id="btnSplit" onclick="previewSplit()" title="Se tiver texto selecionado no textarea, mostra só os parágrafos daquele trecho">&#128196; Ver parágrafos</button>
          <button class="btn btn-primary" id="btnPrefetch" onclick="startPrefetch()">&#9889; Prefetch selecionados</button>
          <button class="btn btn-primary" id="btnPlay" onclick="startPlay()" disabled>&#9654; Play</button>
          <button class="btn btn-secondary" onclick="resetAll()">&#10005; Limpar</button>
        </div>

        <div class="progress-wrap" id="progressWrap" style="display:none">
          <div class="progress-label">
            <span>Cacheado</span>
            <span id="progressText">0 / 0</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>
      </div>

      <!-- Player -->
      <div class="player" id="playerCard" style="display:none">
        <div class="player-title">▶ Reproduzindo</div>
        <div class="player-text" id="playerText">—</div>
        <div class="player-controls">
          <button class="ctrl-btn ctrl-prev" onclick="playPrev()" title="Anterior">◀</button>
          <button class="ctrl-btn ctrl-play" id="ctrlPlay" onclick="togglePlay()" title="Play/Pause">▶</button>
          <button class="ctrl-btn ctrl-next" onclick="playNext()" title="Próximo">▶▶</button>
          <div class="audio-progress" id="audioProgress" onclick="seekAudio(event)">
            <div class="audio-fill" id="audioFill" style="width:0%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="card">
      <label>Parágrafos <span id="paraCount" style="color:var(--accent)"></span></label>
      <div class="sel-toolbar" id="selToolbar" style="display:none">
        <span><span class="sel-count" id="selCount">0</span> selecionados</span>
        <button onclick="selectAll()">Todos</button>
        <button onclick="clearSelection()">Limpar</button>
        <span style="margin-left:auto;font-size:.7rem">clique=selecionar &nbsp; duplo=tocar</span>
      </div>
      <div class="para-list" id="paraList">
        <p style="color:var(--muted);font-size:.85rem;text-align:center;padding:40px 0">Cole um texto e clique em &quot;Ver parágrafos&quot;</p>
      </div>
    </div>
  </div>
</div>

<audio id="audioEl" style="display:none"></audio>

<script type="module">
const BASE = window.location.origin;
let paragraphs = [];   // {text, status:'queued'|'loading'|'cached'|'error', url:null}
let currentIdx = -1;
let isPlaying = false;
let prefetchQueue = [];
let activeWorkers = 0;

// ── PDF import ───────────────────────────────────────────────
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

window.loadPdf = async function(input) {
  const file = input.files[0];
  if (!file) return;
  const label = document.getElementById('pdfLabel');
  const status = document.getElementById('pdfStatus');
  label.innerHTML = '<span class="spinner"></span> Extraindo...';
  status.style.display = 'none';
  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      pages.push(content.items.map(it => it.str).join(' '));
    }
    const fullText = pages.join('\n\n').replace(/[ \t]+/g, ' ').trim();
    document.getElementById('inputText').value = fullText;
    label.textContent = `📄 ${file.name}`;
    status.textContent = `✅ ${pdf.numPages} página(s) extraída(s) — ${fullText.split(/\n\s*\n/).filter(p=>p.trim()).length} parágrafos`;
    status.style.display = 'block';
  } catch(e) {
    label.textContent = '📄 Importar PDF…';
    status.textContent = `❌ Erro: ${e.message}`;
    status.style.color = 'var(--red)';
    status.style.display = 'block';
  }
  input.value = '';
};

const audioEl = document.getElementById('audioEl');
audioEl.addEventListener('ended', () => { playNext(); });
audioEl.addEventListener('timeupdate', updateAudioProgress);

// ── Load voices ──────────────────────────────────────────────
async function loadVoices() {
  try {
    const r = await fetch(`${BASE}/v1/voices`);
    const d = await r.json();
    const sel = document.getElementById('voiceSelect');
    sel.innerHTML = '';
    const favorites = ['Kore','Zephyr','Puck','Charon','Aoede','Fenrir','Leda'];
    const all = d.voices.map(v => v.name);
    const sorted = [...favorites.filter(v => all.includes(v)), ...all.filter(v => !favorites.includes(v))];
    sorted.forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      if (v === 'Kore') o.selected = true;
      sel.appendChild(o);
    });
  } catch(e) { console.error('Erro ao carregar vozes', e); }
}
loadVoices();

// Mostra/esconde "Frases/bloco" conforme o modo de divisão
document.getElementById('splitMode').addEventListener('change', function() {
  document.getElementById('sentCountWrap').style.display = this.value === 'sent' ? '' : 'none';
});


// ── Split text ───────────────────────────────────────────────
function splitParagraphs(text) {
  const mode = document.getElementById('splitMode').value;

  if (mode === 'para') {
    return text.split(/\n\s*\n/).map(p => p.trim()).filter(p => p.length > 0);
  }

  if (mode === 'line') {
    return text.split(/\n/).map(p => p.trim()).filter(p => p.length > 0);
  }

  // mode === 'sent' — agrupa N frases por bloco
  const n = parseInt(document.getElementById('sentCount').value) || 3;
  // Divide por . ! ? seguido de espaço ou fim de linha, preservando o pontuação
  const sentences = text
    .replace(/([.!?])(["\u201d]?)\s+/g, '$1$2\x00')
    .split('\x00')
    .map(s => s.trim())
    .filter(s => s.length > 1);
  const chunks = [];
  for (let i = 0; i < sentences.length; i += n) {
    chunks.push(sentences.slice(i, i + n).join(' '));
  }
  return chunks;
}

// ── Render list ──────────────────────────────────────────────
function updateSelCount() {
  const n = paragraphs.filter(p => p.selected).length;
  document.getElementById('selCount').textContent = n;
}

function renderList() {
  const list = document.getElementById('paraList');
  document.getElementById('paraCount').textContent = `(${paragraphs.length})`;
  if (!paragraphs.length) {
    list.innerHTML = '<p style="color:var(--muted);font-size:.85rem;text-align:center;padding:40px 0">Nenhum parágrafo</p>';
    document.getElementById('selToolbar').style.display = 'none';
    return;
  }
  document.getElementById('selToolbar').style.display = 'flex';
  list.innerHTML = '';
  paragraphs.forEach((p, i) => {
    const div = document.createElement('div');
    const cls = [
      'para-item',
      p.status === 'cached' ? 'cached' : '',
      p.status === 'error'  ? 'error'  : '',
      i === currentIdx      ? 'playing': '',
      p.selected            ? 'selected': '',
    ].filter(Boolean).join(' ');
    div.className = cls;
    div.id = `para-${i}`;

    // Single click = toggle selection
    div.onclick = (e) => { toggleSelect(i); };
    // Double click = play if cached
    div.ondblclick = (e) => { e.preventDefault(); playParagraph(i); };

    const icons   = {queued:'⬜',loading:'⏳',cached:'✅',error:'❌',playing:'▶️'};
    const labels  = {queued:'fila',loading:'carregando',cached:'pronto',error:'erro',playing:'tocando'};
    const badgeCls= {queued:'badge-queued',loading:'badge-loading',cached:'badge-cached',error:'badge-error',playing:'badge-playing'};
    const st = i === currentIdx && isPlaying ? 'playing' : p.status;
    div.innerHTML = `
      <div class="para-meta">
        <span class="para-idx">${p.selected ? '☑' : '#'}${i+1}</span>
        <span class="para-badge ${badgeCls[st]}">${icons[st]} ${labels[st]}</span>
      </div>
      <div class="para-text">${p.text.replace(/</g,'&lt;')}</div>`;
    list.appendChild(div);
  });
  updateSelCount();
  updateProgress();
}

function toggleSelect(i) {
  if (!paragraphs[i]) return;
  paragraphs[i].selected = !paragraphs[i].selected;
  renderList();
}

function selectAll() {
  paragraphs.forEach(p => p.selected = true);
  renderList();
}

function clearSelection() {
  paragraphs.forEach(p => p.selected = false);
  renderList();
}

function updateProgress() {
  const cached = paragraphs.filter(p => p.status === 'cached').length;
  const total = paragraphs.length;
  document.getElementById('progressText').textContent = `${cached} / ${total}`;
  document.getElementById('progressFill').style.width = total ? `${(cached/total)*100}%` : '0%';
  document.getElementById('btnPlay').disabled = cached === 0;
}

// ── Prefetch engine ──────────────────────────────────────────
function getHeaders() {
  const token = document.getElementById('tokenInput').value.trim();
  const h = {'Content-Type':'application/json'};
  if (token) h['Authorization'] = `Bearer ${token}`;
  return h;
}

async function fetchParagraph(idx) {
  const p = paragraphs[idx];
  if (!p || p.status === 'cached') return;
  p.status = 'loading';
  renderList();
  const voice = document.getElementById('voiceSelect').value;
  const model = document.getElementById('modelSelect').value;
  try {
    const token = document.getElementById('tokenInput').value.trim();
    const url = `${BASE}/v1/audio/speech${token ? `?token=${encodeURIComponent(token)}` : ''}`;
    const resp = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({input: p.text, voice, model})
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const blob = await resp.blob();
    p.blobUrl = URL.createObjectURL(blob);
    p.url = p.blobUrl;
    p.status = 'cached';
  } catch(e) {
    p.status = 'error';
    console.error(`Parágrafo ${idx} erro:`, e);
  }
  renderList();
}

async function runWorker() {
  while (prefetchQueue.length > 0) {
    const idx = prefetchQueue.shift();
    await fetchParagraph(idx);
  }
  activeWorkers--;
}

// ── Preview split ────────────────────────────────────────────
function previewSplit() {
  const ta = document.getElementById('inputText');
  // Usa seleção do textarea se houver, senão o texto inteiro
  const start = ta.selectionStart;
  const end   = ta.selectionEnd;
  const text  = (start !== end) ? ta.value.slice(start, end) : ta.value;

  if (!text.trim()) return;
  const parts = splitParagraphs(text);
  if (!parts.length) return;
  paragraphs = parts.map(t => ({text:t, status:'queued', url:null, selected:false}));
  currentIdx = -1;
  isPlaying = false;
  document.getElementById('progressWrap').style.display = 'none';
  renderList();
}

async function startPrefetch() {
  // Se ainda não carregou parágrafos, faz o split agora
  if (paragraphs.length === 0) {
    previewSplit();
    if (paragraphs.length === 0) return;
  }

  // Determina alvos (selecionados, ou todos se nenhum marcado)
  const targets = paragraphs
    .map((p, i) => ({p, i}))
    .filter(({p}) => p.selected || paragraphs.every(x => !x.selected))
    .filter(({p}) => p.status !== 'cached')
    .map(({i}) => i);

  if (targets.length === 0) { alert('Nenhum parágrafo para cachear.'); return; }

  // ── Consulta cache do servidor antes de sintetizar ──────────
  const voice = document.getElementById('voiceSelect').value;
  const model = document.getElementById('modelSelect').value;
  const token = document.getElementById('tokenInput').value.trim();
  document.getElementById('btnPrefetch').disabled = true;
  document.getElementById('btnPrefetch').innerHTML = '&#9889; Verificando cache...';
  try {
    const checkUrl = `${BASE}/api/cache-check${token ? `?token=${encodeURIComponent(token)}` : ''}`;
    const chk = await fetch(checkUrl, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ items: targets.map(i => ({text: paragraphs[i].text, voice, model})) })
    });
    if (chk.ok) {
      const { cached } = await chk.json();
      cached.forEach((hit, j) => {
        if (hit) {
          paragraphs[targets[j]].status = 'cached';
          paragraphs[targets[j]].url = `${BASE}/v1/audio/speech${token ? `?token=${encodeURIComponent(token)}` : ''}`;
          // url será re-fetched ao tocar, mas status já reflete cache
          paragraphs[targets[j]].serverCached = true;
        }
      });
    }
  } catch(e) { console.warn('cache-check falhou, prosseguindo normalmente', e); }
  document.getElementById('btnPrefetch').disabled = false;
  document.getElementById('btnPrefetch').innerHTML = '&#9889; Prefetch selecionados';

  // Fila só com os que ainda não estão cacheados
  prefetchQueue = targets.filter(i => paragraphs[i].status !== 'cached');
  targets.forEach(i => { if (paragraphs[i].status !== 'cached') paragraphs[i].status = 'queued'; });

  currentIdx = -1;
  isPlaying = false;
  document.getElementById('progressWrap').style.display = 'block';
  renderList();
  const conc = parseInt(document.getElementById('concurrency').value) || 2;
  activeWorkers = 0;
  for (let i = 0; i < conc; i++) { activeWorkers++; runWorker(); }
}

function resetAll() {
  paragraphs.forEach(p => { if (p.url) URL.revokeObjectURL(p.url); });
  paragraphs = [];
  prefetchQueue = [];
  currentIdx = -1;
  isPlaying = false;
  audioEl.pause();
  document.getElementById('playerCard').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('selToolbar').style.display = 'none';
  document.getElementById('btnPlay').disabled = true;
  document.getElementById('ctrlPlay').textContent = '▶';
  renderList();
}

// ── Player ───────────────────────────────────────────────────
function startPlay() {
  const first = paragraphs.findIndex(p => p.status === 'cached');
  if (first === -1) return;
  playParagraph(first);
}

async function playParagraph(idx) {
  if (!paragraphs[idx] || paragraphs[idx].status !== 'cached') return;
  const p = paragraphs[idx];

  // Se veio do cache do servidor mas ainda não tem blob local, busca agora (retorna instantâneo do cache)
  if (p.serverCached && !p.blobUrl) {
    const voice = document.getElementById('voiceSelect').value;
    const model = document.getElementById('modelSelect').value;
    const token = document.getElementById('tokenInput').value.trim();
    const url = `${BASE}/v1/audio/speech${token ? `?token=${encodeURIComponent(token)}` : ''}`;
    try {
      const resp = await fetch(url, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({input: p.text, voice, model})
      });
      if (resp.ok) { p.blobUrl = URL.createObjectURL(await resp.blob()); }
    } catch(e) { console.error('Erro ao buscar áudio cacheado', e); return; }
  }

  currentIdx = idx;
  isPlaying = true;
  document.getElementById('playerCard').style.display = 'block';
  document.getElementById('playerText').textContent = p.text.slice(0,200) + (p.text.length > 200 ? '…' : '');
  document.getElementById('ctrlPlay').textContent = '⏸';
  audioEl.src = p.blobUrl || p.url;
  audioEl.play();
  renderList();
  const el = document.getElementById(`para-${idx}`);
  if (el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function playNext() {
  const next = paragraphs.findIndex((p, i) => i > currentIdx && p.status === 'cached');
  if (next !== -1) { playParagraph(next); }
  else { isPlaying = false; document.getElementById('ctrlPlay').textContent = '▶'; renderList(); }
}

function playPrev() {
  for (let i = currentIdx - 1; i >= 0; i--) {
    if (paragraphs[i].status === 'cached') { playParagraph(i); return; }
  }
}

function togglePlay() {
  if (!audioEl.src) return;
  if (audioEl.paused) { audioEl.play(); isPlaying = true; document.getElementById('ctrlPlay').textContent = '⏸'; }
  else { audioEl.pause(); isPlaying = false; document.getElementById('ctrlPlay').textContent = '▶'; }
}

function updateAudioProgress() {
  if (!audioEl.duration) return;
  const pct = (audioEl.currentTime / audioEl.duration) * 100;
  document.getElementById('audioFill').style.width = `${pct}%`;
}

function seekAudio(e) {
  if (!audioEl.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audioEl.currentTime = pct * audioEl.duration;
}

// Expose to window for inline onclick handlers (required for type=module)
Object.assign(window, { startPrefetch, previewSplit, startPlay, resetAll, playPrev, playNext, togglePlay, seekAudio, selectAll, clearSelection, toggleSelect });
</script>
